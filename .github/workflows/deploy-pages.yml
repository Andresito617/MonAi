name: Publicar Mis gastos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar los archivos de la app
        uses: actions/upload-pages-artifact@v4
        with:
          path: monai-gastos

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
